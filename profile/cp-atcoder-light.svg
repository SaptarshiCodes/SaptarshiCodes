  <circle cx="60" cy="136" r="36" fill="none" stroke="#808080" stroke-width="6"
          stroke-linecap="round" stroke-dasharray="45.2 226.2"
          transform="rotate(-90 60 136)"/>
  <text x="60" y="131" text-anchor="middle" fill="#1F2328" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="17" font-weight="700">80</text>
  <text x="60" y="146" text-anchor="middle" fill="#6B7280" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="8" font-weight="650">RATING</text>
  <text x="60" y="161" text-anchor="middle" fill="#808080" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="9" font-weight="700">GRAY</text>

  <!-- Right stats Row 1 -->
  
  <text x="135" y="72" fill="#6B7280" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="8" font-weight="650" letter-spacing="0.5">MAX RATING</text>
  <text x="135" y="92" fill="#1F2328" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="20" font-weight="700">80</text>
  
  <text x="310" y="72" fill="#6B7280" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="8" font-weight="650" letter-spacing="0.5">PROBLEMS SOLVED</text>
  <text x="310" y="92" fill="#1F2328" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="20" font-weight="700">4</text>

  <!-- Right stats Row 2 -->
  
  <text x="135" y="122" fill="#6B7280" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="8" font-weight="650" letter-spacing="0.5">GLOBAL AC RANK</text>
  <text x="135" y="142" fill="#1F2328" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="20" font-weight="700">#414,821</text>
  
  <text x="310" y="122" fill="#6B7280" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="8" font-weight="650" letter-spacing="0.5">RATED CONTESTS</text>
