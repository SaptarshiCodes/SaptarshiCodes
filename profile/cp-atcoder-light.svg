<svg width="500" height="220" viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg">
  <rect width="500" height="220" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="499" height="219" fill="none" stroke="#D8DCE5"/>
  
  
  <!-- Icon -->
  <g transform="translate(20, 15)"><polygon points="11,1 21,21 1,21" fill="none" stroke="#1F2328" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="11" y="16.5" text-anchor="middle" fill="#1F2328" font-family="monospace" font-size="8" font-weight="700">AC</text></g>
  <!-- Handle -->
  <text x="54" y="34" fill="#1F2328" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="14" font-weight="700">SaptarshiCodes</text>
  <!-- Platform label -->
  <text x="480" y="34" text-anchor="end" fill="#00A0E9" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="9" font-weight="700" letter-spacing="0.6">ATCODER</text>
  <!-- Divider -->
  <line x1="20" y1="52" x2="480" y2="52" stroke="#D8DCE5" stroke-width="0.8"/>

