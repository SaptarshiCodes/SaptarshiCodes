  <text x="385" y="72" fill="#AAA8B4" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="8" font-weight="650" letter-spacing="0.5">PROBLEMS SOLVED</text>
  <text x="385" y="92" fill="#F7F3EA" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="20" font-weight="700">4</text>

