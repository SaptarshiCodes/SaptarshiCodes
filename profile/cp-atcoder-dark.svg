  <text x="82" y="126" text-anchor="middle" fill="#F7F3EA" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="20" font-weight="700">80</text>
  <text x="82" y="142" text-anchor="middle" fill="#AAA8B4" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="9" font-weight="650" letter-spacing="0.4">RATING</text>
