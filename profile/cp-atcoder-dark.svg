<svg width="650" height="220" viewBox="0 0 650 220" xmlns="http://www.w3.org/2000/svg">
  <rect width="650" height="220" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="649" height="219" fill="none" stroke="#30363d"/>
  
  
  <!-- Icon -->
