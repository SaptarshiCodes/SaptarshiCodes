    PAST YEAR
  </text>


  <!-- ======================================================
       Stars
       ====================================================== -->

  <line
    x1="570"
    y1="113"
    x2="745"
    y2="113"
    stroke="#303644"
    stroke-width="2"
  />


  <text
    x="570"
    y="184"
    fill="#f5f5f5"
    font-family="monospace"
    font-size="48"
    font-weight="500"
  >
    4
  </text>


  <text
    x="570"
    y="226"
    fill="#aab0c0"
    font-family="monospace"
    font-size="19"
    font-weight="700"
  >
    STARS
  </text>


  <!-- ======================================================
       Pull Requests
       ====================================================== -->

  <line
    x1="785"
    y1="113"
    x2="960"
    y2="113"
    stroke="#303644"
    stroke-width="2"
  />


  <text
    x="785"
    y="184"
    fill="#f5f5f5"
    font-family="monospace"
    font-size="48"
    font-weight="500"
  >
    46
  </text>


  <text
    x="785"
    y="226"
    fill="#aab0c0"
    font-family="monospace"
    font-size="19"
    font-weight="700"
  >
    PULL REQUESTS
  </text>


  <!-- ======================================================
       Issues
       ====================================================== -->

  <line
    x1="1000"
    y1="113"
    x2="1175"
    y2="113"
    stroke="#303644"
    stroke-width="2"
  />


  <text
    x="1000"
    y="184"
    fill="#f5f5f5"
    font-family="monospace"
    font-size="48"
    font-weight="500"
  >
