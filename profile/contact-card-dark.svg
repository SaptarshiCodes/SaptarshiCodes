<svg width="1000" height="220" viewBox="0 0 1000 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      <![CDATA[
      @keyframes softFlow1 { 0%{transform:translateX(0px)} 100%{transform:translateX(-1000px)} }
      @keyframes softFlow2 { 0%{transform:translateX(-1000px)} 100%{transform:translateX(0px)} }
      @keyframes softFlow3 { 0%,100%{transform:translateX(-500px)} 50%{transform:translateX(0px)} }
      @keyframes softBreathe { 0%,100%{opacity:.85} 50%{opacity:1} }
      .fl1{animation:softFlow1 11s linear infinite}
      .fl2{animation:softFlow2 15s linear infinite}
      .fl3{animation:softFlow3 19s ease-in-out infinite}
      .breathe{animation:softBreathe 4.5s ease-in-out infinite}
      @media(prefers-reduced-motion:reduce){.fl1,.fl2,.fl3,.breathe{animation:none!important}}
      ]]>
    </style>

    <!-- Blur filters: stdDeviation ≤14 so 3σ=42px. Crests at y=147. 147-42=105 > 0. No clip. -->
    <filter id="spine_d"   x="-5%" y="-600%" width="110%" height="1200%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="core_d"    x="-5%" y="-600%" width="110%" height="1200%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="silk_d"    x="-5%" y="-600%" width="110%" height="1200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="halo_d"    x="-5%" y="-600%" width="110%" height="1200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="ambient_d" x="-5%" y="-600%" width="110%" height="1200%"><feGaussianBlur stdDeviation="14"/></filter>

    <!-- Thread 1: Magenta → Indigo → White → Cyan → Magenta -->
    <linearGradient id="g1_d" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#e879f9" stop-opacity="0.58"/>
      <stop offset="12%"  stop-color="#818cf8"   stop-opacity="0.58"/>
      <stop offset="24%"  stop-color="#f1f5f9"      stop-opacity="0.88"/>
      <stop offset="30%"  stop-color="#60a5fa"   stop-opacity="0.88"/>
      <stop offset="38%"  stop-color="#22d3ee"       stop-opacity="0.58"/>
      <stop offset="50%"  stop-color="#e879f9" stop-opacity="0.58"/>
      <stop offset="60%"  stop-color="#818cf8"   stop-opacity="0.88"/>
      <stop offset="72%"  stop-color="#6d28d9"     stop-opacity="0.58"/>
      <stop offset="86%"  stop-color="#818cf8"   stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0.58"/>
    </linearGradient>
    <linearGradient id="g1c_d" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#e879f9" stop-opacity="0.58"/>
      <stop offset="16%"  stop-color="#818cf8"   stop-opacity="0.88"/>
      <stop offset="26%"  stop-color="#f1f5f9"      stop-opacity="0.88"/>
      <stop offset="34%"  stop-color="#60a5fa"   stop-opacity="0.88"/>
      <stop offset="44%"  stop-color="#e879f9" stop-opacity="0.58"/>
      <stop offset="58%"  stop-color="#818cf8"   stop-opacity="0.88"/>
      <stop offset="74%"  stop-color="#6d28d9"     stop-opacity="0.58"/>
      <stop offset="88%"  stop-color="#818cf8"   stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0.58"/>
    </linearGradient>

    <!-- Thread 2: Deep cobalt/violet undertone -->
    <linearGradient id="g2_d" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#c084fc"  stop-opacity="0.26"/>
      <stop offset="20%"  stop-color="#6d28d9"   stop-opacity="0.26"/>
      <stop offset="34%"  stop-color="#3730a3"   stop-opacity="0.58"/>
      <stop offset="48%"  stop-color="#c084fc"  stop-opacity="0.58"/>
      <stop offset="58%"  stop-color="#818cf8" stop-opacity="0.58"/>
      <stop offset="74%"  stop-color="#1e1b4b" stop-opacity="0.26"/>
      <stop offset="88%"  stop-color="#c084fc"  stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#c084fc"  stop-opacity="0.26"/>
    </linearGradient>

    <!-- Thread 3: Cyan/Teal accent -->
    <linearGradient id="g3_d" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#2dd4bf"    stop-opacity="0.26"/>
      <stop offset="22%"  stop-color="#22d3ee"     stop-opacity="0.62"/>
      <stop offset="42%"  stop-color="#60a5fa" stop-opacity="0.62"/>
      <stop offset="62%"  stop-color="#6d28d9"   stop-opacity="0.26"/>
      <stop offset="80%"  stop-color="#2dd4bf"    stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#22d3ee"     stop-opacity="0.26"/>
    </linearGradient>
  </defs>

  <!-- NO background rect. NO masks. Threads dissipate naturally via gaussian falloff. -->
