      <path d="M -500 165 C -400 147, -320 127, -220 127 C -130 127, -100 199, -20 199 C 65 199, 130 157, 220 157 C 290 157, 330 175, 390 175 C 438 175, 415 185, 500 165 C 600 147, 680 127, 780 127 C 870 127, 900 199, 980 199 C 1065 199, 1130 157, 1220 157 C 1290 157, 1330 175, 1390 175 C 1438 175, 1415 185, 1500 165 C 1600 147, 1680 127, 1780 127 C 1870 127, 1900 199, 1980 199 C 2065 199, 2130 157, 2220 157 C 2290 157, 2330 175, 2390 175 C 2438 175, 2415 185, 2500 165 C 2600 147, 2680 127, 2780 127 C 2870 127, 2900 199, 2980 199 C 3065 199, 3130 157, 3220 157 C 3290 157, 3330 175, 3390 175 C 3438 175, 3415 185, 3500 165" stroke="url(#g1_d)"  stroke-width="7.5" stroke-linecap="round" fill="none" opacity="0.58"/>
    </g>
