      <path d="M -500 161 C -408  143, -325 135, -235 135 C -155 135, -105 187, -25 187 C 55 187, 105 140, 185 140 C 265 140, 335 193, 405 193 C 450 193, 440 177, 500 161 C 592  143, 675 135, 765 135 C 845 135, 895 187, 975 187 C 1055 187, 1105 140, 1185 140 C 1265 140, 1335 193, 1405 193 C 1450 193, 1440 177, 1500 161 C 1592  143, 1675 135, 1765 135 C 1845 135, 1895 187, 1975 187 C 2055 187, 2105 140, 2185 140 C 2265 140, 2335 193, 2405 193 C 2450 193, 2440 177, 2500 161 C 2592  143, 2675 135, 2765 135 C 2845 135, 2895 187, 2975 187 C 3055 187, 3105 140, 3185 140 C 3265 140, 3335 193, 3405 193 C 3450 193, 3440 177, 3500 161" stroke="url(#g3_d)" stroke-width="1.9" stroke-linecap="round" fill="none" opacity="0.62"/>
    </g>

