name: Update Profile Stats

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch competitive programming statistics
        run: python .github/scripts/update_stats.py

      - name: Generate Competitive Programming Cards
        run: node scripts/generate-cp-cards.mjs

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json profile/cp-*.svg profile/intro-card-*.svg
          git diff --staged --quiet || git commit -m "chore(stats): update competitive programming stats and cards [skip ci]"
          git push
