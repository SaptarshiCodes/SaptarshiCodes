name: Update profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2


      # =====================================================
      # SIGNAL FIELD
      # Custom generator
      # NO CALENDAR
      # =====================================================

      - name: Generate Signal Field
        run: node scripts/generate-signal-card.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: ${{ github.repository_owner }}


      # =====================================================
      # ACTIVITY CONSISTENCY
      # Shinpr generator
      # CALENDAR INCLUDED
      # =====================================================

      - name: Generate Activity Consistency
        uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835 # v0.2.0
        id: activity
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          profile: activity-consistency


      # =====================================================
      # LANGUAGE COMPOSITION
      # Shinpr generator
      # =====================================================

      - name: Generate Language Composition
        uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835 # v0.2.0
        id: languages
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          profile: language-composition


      # =====================================================
      # COPY SHINPR GENERATED CARDS
      # Signal Field is NOT copied here because our
      # custom generator already created it in /profile
      # =====================================================

      - name: Stage Shinpr generated cards
        env:
          ACTIVITY_DIR: ${{ steps.activity.outputs.ready-dir }}
          LANGUAGE_DIR: ${{ steps.languages.outputs.ready-dir }}
        run: |
          mkdir -p profile

          cp "$ACTIVITY_DIR"/activity-consistency-*.svg profile/
          cp "$LANGUAGE_DIR"/language-composition-*.svg profile/


      # =====================================================
      # FIX ACTIVITY CONSISTENCY LAYOUT
      # Keeps the calendar but fixes the top statistics
      # =====================================================

      - name: Fix Activity Card Layout
        run: |
          node scripts/fix-activity-card.mjs


      # =====================================================
      # VALIDATE GENERATED CARDS
      # =====================================================

      - name: Validate generated cards
        run: |
          test -s profile/signal-field-wide-light.svg
          test -s profile/signal-field-wide-dark.svg

          test -s profile/activity-consistency-wide-light.svg
          test -s profile/activity-consistency-wide-dark.svg

          test -s profile/language-composition-wide-light.svg
          test -s profile/language-composition-wide-dark.svg


      # =====================================================
      # PUBLISH
      # =====================================================

      - name: Stage changes
        run: |
          git add profile/*.svg


      - name: Publish cards
        run: |
          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update profile stats"
          git push
